<script type="application/json" id="bank-data">{"dna-structure":{"title":"The Structure of DNA, Genes, and Genomes","credit":"Dr Dan Corbett · PMC1026 Pharmaceutical Physiology","terms":[{"term":"DNA nucleotide","definition":"A unit of DNA made of deoxyribose, a phosphate group and a nitrogenous base.","clue":"What do you have once the sugar, phosphate and base are joined as one DNA building block?","page":8,"group":"One building block","sourceLabel":"Slide 8 · The Structure of DNA, Genes, and Genomes","url":"sources/dna-structure.pdf#page=8"},{"term":"Deoxyribose","definition":"The five-carbon sugar in a DNA nucleotide.","clue":"Which component of a DNA nucleotide is a pentose sugar?","page":8,"group":"One building block","sourceLabel":"Slide 8 · The Structure of DNA, Genes, and Genomes","url":"sources/dna-structure.pdf#page=8"},{"term":"Purine","definition":"A double-ring base. Adenine and guanine are the two in DNA.","clue":"Which family would you assign a DNA base with two fused rings to?","page":10,"group":"One building block","sourceLabel":"Slide 10 · The Structure of DNA, Genes, and Genomes","url":"sources/dna-structure.pdf#page=10"},{"term":"Pyrimidine","definition":"A single-ring base. Cytosine and thymine are the two in DNA.","clue":"What family do thymine and cytosine belong to on the basis of their ring structure?","page":10,"group":"One building block","sourceLabel":"Slide 10 · The Structure of DNA, Genes, and Genomes","url":"sources/dna-structure.pdf#page=10"},{"term":"Phosphodiester bond","definition":"A bond that links neighbouring nucleotides along the sugar–phosphate backbone of a DNA strand.","clue":"Which bond would you label along the backbone between neighbouring nucleotides?","page":11,"group":"Two strands","sourceLabel":"Slide 11 · The Structure of DNA, Genes, and Genomes","url":"sources/dna-structure.pdf#page=11"},{"term":"Hydrogen bond","definition":"An interaction between complementary bases that helps hold the two DNA strands together.","clue":"Which type of interaction would you label between the paired bases across the two strands?","page":11,"group":"Two strands","sourceLabel":"Slide 11 · The Structure of DNA, Genes, and Genomes","url":"sources/dna-structure.pdf#page=11"},{"term":"Complementary base pairing","definition":"In double-stranded DNA, adenine pairs with thymine and cytosine pairs with guanine.","clue":"Which rule lets you infer the partner opposite a DNA base?","page":14,"group":"Two strands","sourceLabel":"Slide 14 · The Structure of DNA, Genes, and Genomes","url":"sources/dna-structure.pdf#page=14"},{"term":"Antiparallel","definition":"Describes two DNA strands that run in opposite directions.","clue":"Which word describes the orientation of two DNA strands drawn with arrows pointing in opposite directions?","page":14,"group":"Two strands","sourceLabel":"Slide 14 · The Structure of DNA, Genes, and Genomes","url":"sources/dna-structure.pdf#page=14"},{"term":"Double helix","definition":"The usual shape of two DNA strands twisted around one another.","clue":"What is the name of the shape made when the two strands wind around each other?","page":13,"group":"DNA packaging","sourceLabel":"Slide 13 · The Structure of DNA, Genes, and Genomes","url":"sources/dna-structure.pdf#page=13"},{"term":"Histone","definition":"A protein around which DNA wraps during packaging.","clue":"What is the protein component at the centre of the DNA wrap?","page":16,"group":"DNA packaging","sourceLabel":"Slide 16 · The Structure of DNA, Genes, and Genomes","url":"sources/dna-structure.pdf#page=16"},{"term":"Nucleosome","definition":"A unit of packaging made when a stretch of DNA wraps around histone proteins.","clue":"What is the DNA-and-protein unit formed by wrapping DNA around histones?","page":16,"group":"DNA packaging","sourceLabel":"Slide 16 · The Structure of DNA, Genes, and Genomes","url":"sources/dna-structure.pdf#page=16"},{"term":"Chromatin","definition":"DNA associated with packaging proteins, including the histones in nucleosomes.","clue":"What name describes the material containing DNA and its packaging proteins?","page":16,"group":"DNA packaging","sourceLabel":"Slide 16 · The Structure of DNA, Genes, and Genomes","url":"sources/dna-structure.pdf#page=16"},{"term":"Protein-coding gene","definition":"An inherited stretch of DNA that carries instructions for making a particular protein.","clue":"Which unit would you point to if the question asked for the instructions for one particular protein?","page":20,"group":"Reading the genome","sourceLabel":"Slide 20 · The Structure of DNA, Genes, and Genomes","url":"sources/dna-structure.pdf#page=20"},{"term":"Non-coding DNA","definition":"DNA that does not encode a protein. Some regions help control gene expression or support chromosome structure.","clue":"Which broad category includes DNA regions that regulate genes without encoding proteins?","page":21,"group":"Reading the genome","sourceLabel":"Slide 21 · The Structure of DNA, Genes, and Genomes","url":"sources/dna-structure.pdf#page=21"},{"term":"Promoter","definition":"A DNA region where machinery assembles to start transcription.","clue":"Which region of a gene would you look for to identify where the reading process begins?","page":22,"group":"Reading the genome","sourceLabel":"Slide 22 · The Structure of DNA, Genes, and Genomes","url":"sources/dna-structure.pdf#page=22"},{"term":"Genome","definition":"The complete set of genetic material in a cell.","clue":"Which word would you use for the full DNA collection, including regions outside protein-coding genes?","page":28,"group":"Reading the genome","sourceLabel":"Slide 28 · The Structure of DNA, Genes, and Genomes","url":"sources/dna-structure.pdf#page=28"}],"rounds":{"Lecture vocabulary":["DNA nucleotide","Deoxyribose","Purine","Pyrimidine","Phosphodiester bond","Hydrogen bond","Complementary base pairing","Antiparallel","Double helix","Histone","Nucleosome","Chromatin","Protein-coding gene","Non-coding DNA","Promoter","Genome"]}},"transcription-translation":{"title":"Gene Transcription and Translation","credit":"Dr Dan Corbett · PMC1026 Pharmaceutical Physiology","terms":[{"term":"Transcription","definition":"The process that uses a DNA template to produce an RNA transcript.","clue":"Which process has made an RNA copy when no amino acids have yet been joined?","page":8,"group":"Making the RNA copy","sourceLabel":"Slide 8 · Gene Transcription and Translation","url":"sources/transcription-translation.pdf#page=8"},{"term":"RNA polymerase","definition":"The enzyme that reads a DNA template and joins complementary RNA nucleotides.","clue":"Which enzyme moves along exposed DNA as the RNA strand grows?","page":12,"group":"Making the RNA copy","sourceLabel":"Slide 12 · Gene Transcription and Translation","url":"sources/transcription-translation.pdf#page=12"},{"term":"Template strand","definition":"The DNA strand that RNA polymerase reads to make a complementary RNA chain.","clue":"Which of the two DNA strands supplies the base-pairing pattern during transcription?","page":16,"group":"Making the RNA copy","sourceLabel":"Slide 16 · Gene Transcription and Translation","url":"sources/transcription-translation.pdf#page=16"},{"term":"Transcription bubble","definition":"The locally opened part of the DNA double helix where the template is being read.","clue":"What name does the lecture give the short open region around the moving RNA polymerase?","page":12,"group":"Making the RNA copy","sourceLabel":"Slide 12 · Gene Transcription and Translation","url":"sources/transcription-translation.pdf#page=12"},{"term":"Pre-mRNA","definition":"An initial RNA copy that still needs processing before becoming mature mRNA.","clue":"What is the transcript labelled at the top of the splicing diagram, before any segment is removed?","page":24,"group":"Processing the transcript","sourceLabel":"Slide 24 · Gene Transcription and Translation","url":"sources/transcription-translation.pdf#page=24"},{"term":"Intron","definition":"A segment present in the initial transcript that is removed during splicing.","clue":"Which part of the initial RNA is looped out in the splicing diagram?","page":24,"group":"Processing the transcript","sourceLabel":"Slide 24 · Gene Transcription and Translation","url":"sources/transcription-translation.pdf#page=24"},{"term":"Exon","definition":"A segment retained in the spliced RNA. The diagram shows two of these joined together.","clue":"Which type of segment appears on both sides of the removed loop and remains in the mature RNA?","page":24,"group":"Processing the transcript","sourceLabel":"Slide 24 · Gene Transcription and Translation","url":"sources/transcription-translation.pdf#page=24"},{"term":"RNA splicing","definition":"Processing that removes introns and joins the retained exons of an RNA transcript.","clue":"Which processing event explains why two previously separated segments sit side by side in mature mRNA?","page":24,"group":"Processing the transcript","sourceLabel":"Slide 24 · Gene Transcription and Translation","url":"sources/transcription-translation.pdf#page=24"},{"term":"Codon","definition":"A three-nucleotide unit in mRNA read during translation.","clue":"What is the name of one three-letter unit read on the messenger RNA?","page":27,"group":"Reading the message","sourceLabel":"Slide 27 · Gene Transcription and Translation","url":"sources/transcription-translation.pdf#page=27"},{"term":"Start codon","definition":"In the lecture's example, AUG marks where translation starts and specifies methionine.","clue":"What kind of signal both starts translation and specifies the first amino acid in this example?","page":30,"group":"Reading the message","sourceLabel":"Slide 30 · Gene Transcription and Translation","url":"sources/transcription-translation.pdf#page=30"},{"term":"Stop codon","definition":"A codon that signals the end of translation without specifying an amino acid.","clue":"Which signal means that the amino acid chain is complete?","page":29,"group":"Reading the message","sourceLabel":"Slide 29 · Gene Transcription and Translation","url":"sources/transcription-translation.pdf#page=29"},{"term":"Anticodon","definition":"A three-base sequence on tRNA that pairs with a complementary mRNA codon.","clue":"What is the matching three-base sequence carried by the adaptor molecule?","page":32,"group":"Reading the message","sourceLabel":"Slide 32 · Gene Transcription and Translation","url":"sources/transcription-translation.pdf#page=32"},{"term":"Transfer RNA (tRNA)","definition":"An adaptor that carries a particular amino acid and pairs its anticodon with an mRNA codon.","clue":"Which molecule connects a codon on the message with its corresponding amino acid?","page":32,"group":"Building the chain","sourceLabel":"Slide 32 · Gene Transcription and Translation","url":"sources/transcription-translation.pdf#page=32"},{"term":"Ribosome","definition":"The molecular machinery that reads mRNA and brings the appropriate tRNAs together during translation.","clue":"Which structure assembles around the message and reads along it as the chain grows?","page":32,"group":"Building the chain","sourceLabel":"Slide 32 · Gene Transcription and Translation","url":"sources/transcription-translation.pdf#page=32"},{"term":"Translation","definition":"The process in which ribosomes read mRNA codons to produce an amino acid sequence.","clue":"What process turns a message written in RNA nucleotides into a chain written in amino acids?","page":33,"group":"Building the chain","sourceLabel":"Slide 33 · Gene Transcription and Translation","url":"sources/transcription-translation.pdf#page=33"},{"term":"Primary protein structure","definition":"The order of the amino acids in a polypeptide chain.","clue":"What level of structure have you described if you have listed the amino acids in their order along a chain?","page":35,"group":"Building the chain","sourceLabel":"Slide 35 · Gene Transcription and Translation","url":"sources/transcription-translation.pdf#page=35"}],"rounds":{"Lecture vocabulary":["Transcription","RNA polymerase","Template strand","Transcription bubble","Pre-mRNA","Intron","Exon","RNA splicing","Codon","Start codon","Stop codon","Anticodon","Transfer RNA (tRNA)","Ribosome","Translation","Primary protein structure"]}},"transcription-regulation":{"title":"Regulation of Transcription","credit":"Dr Dan Corbett · PMC1026 Pharmaceutical Physiology","terms":[{"term":"Transcriptional regulation","definition":"Control of when a gene is transcribed and how much RNA is made.","clue":"Which term covers changing the amount of RNA made from a gene as a cell’s needs change?","page":8,"group":"Why expression varies","sourceLabel":"Slide 8 · Regulation of Transcription","url":"sources/transcription-regulation.pdf#page=8"},{"term":"Constitutive gene","definition":"A gene expressed on an ongoing basis to support functions the cell regularly needs.","clue":"Which term does the lecture use for genes that are routinely expressed for everyday cellular functions?","page":6,"group":"Why expression varies","sourceLabel":"Slide 6 · Regulation of Transcription","url":"sources/transcription-regulation.pdf#page=6"},{"term":"Promoter","definition":"A DNA region near a gene’s transcription start where the basic transcription machinery assembles.","clue":"Which DNA region marks where the basic machinery begins transcription?","page":11,"group":"Why expression varies","sourceLabel":"Slide 11 · Regulation of Transcription","url":"sources/transcription-regulation.pdf#page=11"},{"term":"Promoter-proximal element","definition":"A regulatory DNA site near the promoter where binding proteins can fine-tune transcription.","clue":"What is the name for a nearby regulatory site that adjusts the basic activity of the promoter?","page":13,"group":"Why expression varies","sourceLabel":"Slide 13 · Regulation of Transcription","url":"sources/transcription-regulation.pdf#page=13"},{"term":"Enhancer","definition":"A regulatory DNA region that can support increased transcription when appropriate proteins bind.","clue":"What is the name of the DNA site that an activator binds in the lecture’s diagram?","page":17,"group":"A regulatory site and its partner","sourceLabel":"Slide 17 · Regulation of Transcription","url":"sources/transcription-regulation.pdf#page=17"},{"term":"Activator","definition":"A protein that can increase transcription when it acts at a regulatory site.","clue":"Which protein binds the enhancer in the lecture's example and favours more transcription?","page":17,"group":"A regulatory site and its partner","sourceLabel":"Slide 17 · Regulation of Transcription","url":"sources/transcription-regulation.pdf#page=17"},{"term":"Silencer","definition":"A regulatory DNA region where a bound repressor can reduce transcription.","clue":"What is the DNA site called in the example where a bound protein reduces transcription?","page":17,"group":"A regulatory site and its partner","sourceLabel":"Slide 17 · Regulation of Transcription","url":"sources/transcription-regulation.pdf#page=17"},{"term":"Repressor","definition":"A regulatory protein that can decrease transcription of a gene.","clue":"What is the name of the protein partner at the silencer in the example?","page":17,"group":"A regulatory site and its partner","sourceLabel":"Slide 17 · Regulation of Transcription","url":"sources/transcription-regulation.pdf#page=17"},{"term":"DNA looping","definition":"Bending of DNA that brings regulatory elements near machinery at the promoter in three-dimensional space.","clue":"What feature of the diagram explains how two sites far apart along one DNA molecule can meet?","page":15,"group":"Access to DNA","sourceLabel":"Slide 15 · Regulation of Transcription","url":"sources/transcription-regulation.pdf#page=15"},{"term":"DNA methylation","definition":"Addition of methyl groups to DNA. The lecture shows promoter methylation as one influence that can reduce transcription.","clue":"Which modification adds methyl groups to DNA in the promoter example?","page":19,"group":"Access to DNA","sourceLabel":"Slide 19 · Regulation of Transcription","url":"sources/transcription-regulation.pdf#page=19"},{"term":"Histone acetylation","definition":"Addition of acetyl groups to histones. In the lecture example this makes DNA more accessible for transcription.","clue":"Which modification adds acetyl groups to the proteins that package DNA?","page":20,"group":"Access to DNA","sourceLabel":"Slide 20 · Regulation of Transcription","url":"sources/transcription-regulation.pdf#page=20"},{"term":"Histone deacetylation","definition":"Removal of acetyl groups from histones. In the lecture example this favours a less accessible state.","clue":"What is the name of the process that removes the acetyl groups from these packaging proteins?","page":20,"group":"Access to DNA","sourceLabel":"Slide 20 · Regulation of Transcription","url":"sources/transcription-regulation.pdf#page=20"},{"term":"Transcription factor","definition":"A protein that influences transcription by binding a specific DNA sequence in the lecture examples.","clue":"Which general class includes many proteins that recognise regulatory DNA sequences?","page":22,"group":"Signals and cell identity","sourceLabel":"Slide 22 · Regulation of Transcription","url":"sources/transcription-regulation.pdf#page=22"},{"term":"Post-translational modification","definition":"A chemical change to a protein after it has been made. This can alter the activity of a transcription factor.","clue":"What type of change could regulate an existing factor by chemically modifying the protein itself?","page":25,"group":"Signals and cell identity","sourceLabel":"Slide 25 · Regulation of Transcription","url":"sources/transcription-regulation.pdf#page=25"},{"term":"Ligand binding","definition":"Attachment of another molecule to a protein, which can change the protein’s shape and activity.","clue":"Which interaction changes a factor's shape when another molecule attaches?","page":25,"group":"Signals and cell identity","sourceLabel":"Slide 25 · Regulation of Transcription","url":"sources/transcription-regulation.pdf#page=25"},{"term":"Nuclear localisation","definition":"Movement or targeting of a protein to the nucleus, where a transcription factor can reach its DNA target.","clue":"Which change in a factor’s location could bring an already active protein to its site of action?","page":25,"group":"Signals and cell identity","sourceLabel":"Slide 25 · Regulation of Transcription","url":"sources/transcription-regulation.pdf#page=25"}],"rounds":{"Lecture vocabulary":["Transcriptional regulation","Constitutive gene","Promoter","Promoter-proximal element","Enhancer","Activator","Silencer","Repressor","DNA looping","DNA methylation","Histone acetylation","Histone deacetylation","Transcription factor","Post-translational modification","Ligand binding","Nuclear localisation"]}},"inheritance":{"title":"Inheritance of Genes","credit":"Dr Dan Corbett · PMC1026 Pharmaceutical Physiology","terms":[{"term":"DNA replication","definition":"Copying DNA before cell division so that the genetic material can pass to daughter cells.","clue":"Which process creates two copies of the DNA before it is distributed during division?","page":4,"group":"Copying DNA","sourceLabel":"Slide 4 · Inheritance of Genes","url":"sources/inheritance.pdf#page=4"},{"term":"Semi-conservative replication","definition":"Each new DNA double helix contains one parental strand and one newly made strand.","clue":"Which description of replication explains the origin of the two strands in each daughter DNA molecule?","page":5,"group":"Copying DNA","sourceLabel":"Slide 5 · Inheritance of Genes","url":"sources/inheritance.pdf#page=5"},{"term":"Sister chromatids","definition":"The two copies of a replicated chromosome that remain joined before separation.","clue":"Which paired structures belong to one replicated chromosome before they are pulled apart?","page":17,"group":"Copying DNA","sourceLabel":"Slide 17 · Inheritance of Genes","url":"sources/inheritance.pdf#page=17"},{"term":"Centromere","definition":"The region where sister chromatids remain associated in the replicated chromosome shown.","clue":"Which chromosome region would you label at the join between the sister chromatids in the diagram?","page":17,"group":"Copying DNA","sourceLabel":"Slide 17 · Inheritance of Genes","url":"sources/inheritance.pdf#page=17"},{"term":"Mitosis","definition":"Nuclear division that distributes equivalent chromosome sets to daughter nuclei during growth and repair.","clue":"Which type of nuclear division maintains the chromosome complement during tissue growth?","page":15,"group":"Reading mitosis","sourceLabel":"Slide 15 · Inheritance of Genes","url":"sources/inheritance.pdf#page=15"},{"term":"Metaphase","definition":"The stage of mitosis when the chromosomes are aligned across the middle of the cell.","clue":"At which stage would an observer see all the chromosomes arranged on the equator?","page":19,"group":"Reading mitosis","sourceLabel":"Slide 19 · Inheritance of Genes","url":"sources/inheritance.pdf#page=19"},{"term":"Anaphase","definition":"The stage of mitosis when sister chromatids separate and move towards opposite poles.","clue":"At which stage of mitosis have the paired copies begun moving apart?","page":20,"group":"Reading mitosis","sourceLabel":"Slide 20 · Inheritance of Genes","url":"sources/inheritance.pdf#page=20"},{"term":"Cytokinesis","definition":"Division of the cytoplasm that physically separates the daughter cells.","clue":"Which process still has to partition the cytoplasm after two daughter nuclei form?","page":22,"group":"Reading mitosis","sourceLabel":"Slide 22 · Inheritance of Genes","url":"sources/inheritance.pdf#page=22"},{"term":"Meiosis","definition":"A sequence of two divisions that produces cells with one chromosome set after DNA has been copied once.","clue":"Which division programme reduces chromosome sets for sexual reproduction?","page":27,"group":"Reading meiosis","sourceLabel":"Slide 27 · Inheritance of Genes","url":"sources/inheritance.pdf#page=27"},{"term":"Meiosis I","definition":"The division in which homologous chromosomes separate while sister chromatids remain joined.","clue":"Which division has just finished when homologues have separated but each chromosome still has two chromatids?","page":28,"group":"Reading meiosis","sourceLabel":"Slide 28 · Inheritance of Genes","url":"sources/inheritance.pdf#page=28"},{"term":"Meiosis II","definition":"The division that separates sister chromatids after homologous chromosomes have already separated.","clue":"Which division separates the remaining paired chromatids without a new round of DNA copying?","page":28,"group":"Reading meiosis","sourceLabel":"Slide 28 · Inheritance of Genes","url":"sources/inheritance.pdf#page=28"},{"term":"Haploid","definition":"Having one set of chromosomes. A typical human gamete has 23 chromosomes.","clue":"What word describes a cell with one chromosome from each homologous pair?","page":26,"group":"Reading meiosis","sourceLabel":"Slide 26 · Inheritance of Genes","url":"sources/inheritance.pdf#page=26"},{"term":"Crossing over","definition":"Exchange of corresponding DNA segments between homologous chromosomes in prophase I of meiosis.","clue":"Which event exchanges segments between the paired maternal and paternal chromosomes?","page":31,"group":"Explaining variation","sourceLabel":"Slide 31 · Inheritance of Genes","url":"sources/inheritance.pdf#page=31"},{"term":"Independent assortment","definition":"Different homologous chromosome pairs orient independently during meiosis I, producing different combinations.","clue":"Which process creates different chromosome combinations through the way pairs line up at the first division?","page":32,"group":"Explaining variation","sourceLabel":"Slide 32 · Inheritance of Genes","url":"sources/inheritance.pdf#page=32"},{"term":"Diploid","definition":"Having two sets of chromosomes. Typical human somatic cells have 23 pairs.","clue":"What word describes the chromosome complement when both full sets are present?","page":26,"group":"Explaining variation","sourceLabel":"Slide 26 · Inheritance of Genes","url":"sources/inheritance.pdf#page=26"},{"term":"Fertilisation","definition":"Union of two haploid gametes that restores the diploid chromosome complement.","clue":"Which event brings two one-set contributions together to restore a two-set complement?","page":34,"group":"Explaining variation","sourceLabel":"Slide 34 · Inheritance of Genes","url":"sources/inheritance.pdf#page=34"}],"rounds":{"Lecture vocabulary":["DNA replication","Semi-conservative replication","Sister chromatids","Centromere","Mitosis","Metaphase","Anaphase","Cytokinesis","Meiosis","Meiosis I","Meiosis II","Haploid","Crossing over","Independent assortment","Diploid","Fertilisation"]}},"queens":{"title":"Queen’s acronyms at work","credit":"Queen’s University Belfast · Staff vocabulary","terms":[{"term":"QOL","definition":"Queen’s Online","clue":"A colleague asks where to sign in for links to University services. Which three letters name the portal?","context":"The portal brings staff and student services together.","group":"Everyday systems","source":"qol","sourceLabel":"Queen’s Online service catalogue","url":"https://www.qub.ac.uk/directorates/InformationServices/Services/Catalogue/QueensOnline/"},{"term":"Qsis","definition":"Queen’s Student Information System","clue":"An administrator needs to look up a student’s enrolment record. Which system holds it?","context":"Student Administration uses the name Qsis for the system supporting the student lifecycle.","group":"Everyday systems","source":"admin","sourceLabel":"Student Administration","url":"https://www.qub.ac.uk/directorates/academic-services/student-administration/"},{"term":"Qfis","definition":"Queen’s Financial Information System","clue":"A finance colleague is setting up a project record. Whi ument.","group":"People and committees","source":"sop","sourceLabel":"School of Pharmacy Athena Swan application, Appendix 3, pp. 175–177","url":"https://www.qub.ac.uk/schools/SchoolofPharmacy/Filestore/SoP%20SWAN%20Gold_Redacted%20version%202.pdf#page=175"},{"term":"SSC","definition":"School Staff Committee","clue":"In the Pharmacy application, which committee acronym denotes a forum for School staff?","context":"The expansion is specific to this School document. Check the heading before using it elsewhere.","group":"People and committees","source":"sop","sourceLabel":"School of Pharmacy Athena Swan application, Appendix 3, pp. 175–177","url":"https://www.qub.ac.uk/schools/SchoolofPharmacy/Filestore/SoP%20SWAN%20Gold_Redacted%20version%202.pdf#page=175"},{"term":"SMC","definition":"School Management Committee","clue":"Within the Pharmacy application, which three letters label the committee for School management?","context":"Keep the School-level body distinct from a University-level board.","group":"People and committees","source":"sop","sourceLabel":"School of Pharmacy Athena Swan application, Appendix 3, pp. 175–177","url":"https://www.qub.ac.uk/schools/SchoolofPharmacy/Filestore/SoP%20SWAN%20Gold_Redacted%20version%202.pdf#page=175"},{"term":"ToR","definition":"Terms of Reference","clue":"Which short label heads the document setting out what a working group is there to do?","context":"The Pharmacy glossary uses this shorthand for a group’s remit.","group":"People and committees","source":"sop","sourceLabel":"School of Pharmacy Athena Swan application, Appendix 3, pp. 175–177","url":"https://www.qub.ac.uk/schools/SchoolofPharmacy/Filestore/SoP%20SWAN%20Gold_Redacted%20version%202.pdf#page=175"},{"term":"UMB","definition":"University Management Board","clue":"Which board handles operational management under authority delegated by Senate?","context":"Queen’s current governance page describes the board’s operational role.","group":"People and committees","source":"u ppear beside the Queen’s Portal route for reporting circumstances affecting assessment?","context":"Refer a student to the live University procedure for advice on their own case.","group":"Administration and compliance","source":"portal","sourceLabel":"Queen’s Portal, Qsis services and exceptional circumstances","url":"https://www.qub.ac.uk/directorates/InformationServices/digital-transformation/queens-portal/updates/qsis-maintenance/"}],"rounds":{"Staff starter":["QOL","Qsis","PDR","SVC","ISSA","PO","CED","HEAR","QFT"],"Staff mix":["QOL","Qsis","PDR","SVC","ISSA","PO","CED","HEAR","QFT","MFA","REF","DPIA","PDC","PGR","UDL","NSS"],"Everyday systems":["QOL","Qsis","Qfis","D&IS","MFA","QVSD","CMS","PO"],"Student voice":["NSS","QSS","PTES","PRES","GOS","SVC","SU","HEAR","HESA"],"Learning and support":["CED","VLE","UDL","OER","LMS","ALS","ISSA","DSA","UG","PGT","PGR","RPEL","FHEQ"],"Faculties and schools":["QUB","AHSS","EPS","MHLS","SoP","QBS","AEL","HAPP","SSESW","EEECS","SBS","SNaM"],"People and committees":["P&C","PDR","PDC","QGI","EDI","HoS","PTO","SSC","SMC","ToR","UMB","FSAC","CSAC","SECC"],"Research and campus":["REF","DMP","DOI","ORCID","ORR","QFT","PEC","MBC","QML","PPI","BRCD","AMIC"],"Administration and compliance":["DPIA","ISS","CAS","UKVI","ATAS","EC"],"Full collection":["QOL","Qsis","Qfis","D&IS","MFA","QVSD","CMS","PO","NSS","QSS","PTES","PRES","GOS","SVC","SU","HEAR","HESA","CED","VLE","UDL","OER","LMS","ALS","ISSA","DSA","UG","PGT","PGR","RPEL","FHEQ","QUB","AHSS","EPS","MHLS","SoP","QBS","AEL","HAPP","SSESW","EEECS","SBS","SNaM","P&C","PDR","PDC","QGI","EDI","HoS","PTO","SSC","SMC","ToR","UMB","FSAC","CSAC","SECC","REF","DMP","DOI","ORCID","ORR","QFT","PEC","MBC","QML","PPI","BRCD","AMIC","DPIA","ISS","CAS","UKVI","ATAS","EC"]}}}</script>
<script>
(() => {
  'use strict';
  const byId = id => document.getElementById(id);
  const published = 'https://queens-copilot-in-30.pptech79.chatgpt.site/vibe-coding/samples/';
  const banks = JSON.parse(byId('bank-data').textContent);
  const state = {key:'', round:'', card:[], deck:[], turn:0, marks:new Set(), side:3};
  const cardFeedback = byId('card-feedback');
  const clueFeedback = byId('feedback');
  const blank = node => node.replaceChildren();
  function bank() { return banks[state.key]; }
  function pool() {
    const values = new Set(bank().rounds[state.round]);
    return bank().terms.filter(entry => values.has(entry.term));
  }
  function shuffled(list) {
    const result = list.slice();
    for (let i = result.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
  }
  function selectOptions(select, options) {
    select.replaceChildren(...options.map(([value, text]) => new Option(text, value)));
  }
  function sourceLink(entry) {
    const link = document.createElement('a');
    link.href = new URL(entry.url, published).href;
    link.target = '_blank';
    link.rel = 'noopener';
    link.textContent = entry.sourceLabel;
    return link;
  }
  function message(text, evidence, feedback = cardFeedback) {
    blank(feedback === cardFeedback ? clueFeedback : cardFeedback);
    const p = document.createElement('p');
    p.textContent = text;
    feedback.replaceChildren(p);
    if (evidence) {
      const explanation = document.createElement('p');
      const term = document.createElement('strong');
      term.textContent = evidence.term + ' · ';
      explanation.append(term, evidence.definition + (evidence.context ? ' ' + evidence.context : ''));
      feedback.append(explanation);
      if (evidence.url) feedback.append(sourceLink(evidence));
    }
  }
  function completedLines() {
    const full = indices => indices.every(i => state.marks.has(state.card[i].term));
    const cells = Array.from({length: state.side}, (_, i) => i);
    let total = 0;
    for (const i of cells) {
      total += Number(full(cells.map(j => i * state.side + j)));
      total += Number(full(cells.map(j => j * state.side + i)));
    }
    total += Number(full(cells.map(i => i * state.side + i)));
    total += Number(full(cells.map(i => (i + 1) * state.side - i - 1)));
    return total;
  }
  function progress() {
    const lines = completedLines();
    let result = state.marks.size + ' of ' + state.card.length + ' marked';
    if (lines) result += ' · ' + lines + (lines === 1 ? ' line' : ' lines');
    byId('progress').textContent = result;
  }
  function choose(entry, tile) {
    const target = state.deck[state.turn];
    if (entry.term !== target.term) {
      message('That term fits a different clue. Read this clue again, choose another term, or check the answer.');
      return;
    }
    if (state.marks.has(entry.term)) {
      message('You have already matched this clue.', entry);
      return;
    }
    const earlier = completedLines();
    state.marks.add(entry.term);
    tile.classList.add('matched');
    tile.setAttribute('aria-label', entry.term + ', marked');
    let result = 'Match. The square is marked.';
    if (completedLines() > earlier) result = 'Bingo! You completed a line.';
    if (state.marks.size === state.card.length) result = 'Full card! You matched every square.';
    message(result, entry);
    progress();
  }
  function showBoard() {
    const grid = byId('board');
    grid.style.setProperty('--side', state.side);
    grid.replaceChildren(...state.card.map(entry => {
      const tile = document.createElement('button');
      tile.type = 'button';
      tile.textContent = entry.term;
      tile.addEventListener('click', () => choose(entry, tile));
      return tile;
    }));
    progress();
  }
  function showClue(moveFocus = false) {
    const entry = state.deck[state.turn];
    byId('clue-number').textContent = 'Clue ' + (state.turn + 1) + ' of ' + state.deck.length;
    byId('clue-title').textContent = entry.clue;
    byId('previous').disabled = state.turn === 0;
    byId('next').disabled = state.turn === state.deck.length - 1;
    blank(clueFeedback);
    blank(cardFeedback);
    if (moveFocus) byId('clue-title').focus();
  }

  function start() {
    const terms = pool();
    state.side = terms.length < 9 ? 2 : 3;
    state.card = shuffled(terms).slice(0,state.side ** 2);
    state.deck = shuffled(state.card);
    state.marks.clear();
    state.turn = 0;
    showBoard();
    showClue();
  }
  function openBank(key) {
    state.key = key;
    const rounds = Object.entries(bank().rounds);
    selectOptions(byId('round'),rounds.map(([name,entries]) => [name,name+' ('+entries.length+')']));
    const requestedRound = new URLSearchParams(location.search).get('round');
    state.round = Object.hasOwn(bank().rounds,requestedRound) ? requestedRound : rounds[0][0];
    byId('round').value = state.round;
    byId('round-wrap').hidden = rounds.length === 1;
    byId('bank').value = key;
    byId('credit').textContent = bank().credit;
    byId('open-full').href = new URL('bingo#'+key,published).href;
    start();
  }
  selectOptions(byId('bank'),Object.entries(banks).map(([id,b]) => [id,b.title]));
  const key = location.hash.slice(1);
  openBank(Object.hasOwn(banks,key) ? key : Object.keys(banks)[0]);
  byId('bank').onchange = event => openBank(event.target.value);
  byId('round').onchange = event => { state.round = event.target.value; start(); };
  byId('next').onclick = () => {state.turn++; showClue(true);};
  byId('previous').onclick = () => {state.turn--; showClue(true);};
  byId('new-card').onclick = () => {start(); message('A fresh card is ready. Start with clue 1.');};
  byId('reveal').onclick = () => message('Compare your explanation with the source.',state.deck[state.turn],clueFeedback);
})();
</script></body></html>
