<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flipbook · Workshop slide</title>
<style>
:root{font:clamp(16px,2.05vh,26px)/1.35 system-ui,"Segoe UI",sans-serif;color:#19233f;background:#f3f4fa;color-scheme:light}
*{box-sizing:border-box}body{margin:0}main{height:100vh;height:100dvh;padding:.65rem 1rem;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:.55rem;margin:auto;max-width:110rem}header,footer,.controls{display:flex;align-items:center;gap:.65rem}header{border-top:.24rem solid #aa0039;padding-top:.4rem;justify-content:space-between}h1{font-size:1.25rem;margin:0}h2,p{margin:0}a{color:#8c0635;font-weight:650}a:focus-visible,button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #006899;outline-offset:2px}label{font-size:.88rem;font-weight:650}select,button{font:inherit;border:1px solid #929fb6;border-radius:.4rem;background:white;color:#19233f;padding:.35rem .6rem;min-height:2.1rem}button,select,summary{cursor:pointer}button:disabled{opacity:.55;cursor:default}#next{color:#fff;background:#202951;border-color:#202951}
#stage{display:grid;grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr);gap:.8rem;min-height:0}#stage.with-practice{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
#sheet{display:grid;grid-template-rows:minmax(0,1fr);place-items:center;min-width:0;min-height:0;border-radius:.65rem;background:#fff;border:1px solid #c6ccdb;overflow:clip}#sheet>div{width:100%;height:100%;min-height:0}#sheet img{display:block;height:100%;width:100%;object-fit:contain}#sheet .demo{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:1.2rem 2rem;gap:.8rem;background:#fdfaf3;border-left:.3rem solid #9c3354}.demo small{color:#86344f;font-weight:700}.demo h2{font-size:clamp(1.25rem,2.8vw,2.4rem);line-height:1.12}.demo p{font-size:1.15rem;max-width:55ch}.sculpture{display:none}aside{align-self:center;background:white;border:1px solid #c6ccdb;border-top:.22rem solid #977648;border-radius:.65rem;padding:.85rem;display:grid;gap:.55rem}aside h2{font-size:1.1rem}aside details p{margin-top:.4rem}summary{color:#72304f;font-weight:700}.controls{flex-wrap:nowrap}footer{justify-content:space-between;min-width:0}footer label{display:flex;align-items:center;gap:.5rem;min-width:0}#page{max-width:38vw}.folio{font-size:.9rem;white-space:nowrap}header select{max-width:40vw}[hidden]{display:none!important}
@media(max-aspect-ratio:1/1){main{height:auto;min-height:100dvh}header,footer{flex-wrap:wrap}#stage.with-practice{grid-template-columns:1fr}#sheet{min-height:40vh}#sheet img{max-height:56vh}#page{max-width:65vw}}
</style></head>
<body><main><header><h1>Flipbook</h1><label>Source <select id="source"></select></label><a id="full" target="_blank" rel="noopener">Open full activity</a></header>
<section id="stage" aria-label="Flipbook page"><div id="sheet" aria-live="polite"><p>Opening the book…</p></div><aside id="practice" hidden></aside></section>
<footer><label>Page <select id="page" disabled></select></label><div class="controls"><button type="button" id="prev" disabled>Previous</button><span id="count" class="folio" aria-live="polite"></span><button type="button" id="next" disabled>Next page</button></div></footer></main>
<script>
'use strict';
const byId=id=>document.getElementById(id);
const banks={'dna-structure':'DNA structure','transcription-translation':'Transcription & translation','transcription-regulation':'Gene regulation',inheritance:'Inheritance',queens:'Queen’s acronyms'};
const official=new URL("https://queens-copilot-in-30.pptech79.chatgpt.site/vibe-coding/samples/books/");
const saved=new Map(), cache=new Map();
let book=null,current=0,active='',controller;
for(const [id,title] of Object.entries(banks))byId('source').add(new Option(title,id));
function element(tag,text){const e=document.createElement(tag);e.textContent=text;return e}
function face(page,index){
 const pane=document.createElement('div');
 if(page.image){const img=document.createElement('img');img.src=page.image;img.alt=page.text||page.title||('PDF page '+(index+1));pane.append(img)}
 else{pane.className='demo';for(const [tag,key] of [['small','label'],['h2','title'],['p','text']])if(page[key])pane.append(element(tag,page[key]))}
 return pane;
}
function show(){
 const page=book.pages[current], practice=byId('practice');byId('sheet').replaceChildren(face(page,current));
 byId('stage').classList.toggle('with-practice',Boolean(page.practice));practice.hidden=!page.practice;practice.replaceChildren();
 if(page.practice){const item=page.practice,answer=element('details','');answer.append(element('summary','Compare after your attempt'),element('p',item.answer));practice.append(element('h2',item.title),element('p',item.prompt),answer)}
 byId('page').value=String(current);byId('count').textContent=(current+1)+' / '+book.pages.length;
 byId('prev').disabled=current===0;byId('next').disabled=current===book.pages.length-1;saved.set(active,current);
}
function turn(step){
 if(!book)return;const target=current+step;if(target<0||target>=book.pages.length)return;
 current=target;show();if(!matchMedia('(prefers-reduced-motion: reduce)').matches)byId('sheet').animate([{opacity:.65,transform:'perspective(900px) rotateY('+(-step*5)+'deg)'},{opacity:1,transform:'none'}],{duration:210});
}
async function load(id){
 if(controller)controller.abort();controller=new AbortController();const signal=controller.signal;active=id;book=null;
 const url=new URL(id+'.html',official);byId('full').href=url.href;byId('source').value=id;
 byId('next').disabled=byId('prev').disabled=byId('page').disabled=true;byId('page').replaceChildren();byId('count').textContent='';
 byId('sheet').replaceChildren(element('p','Opening the book…'));byId('practice').hidden=true;byId('stage').classList.remove('with-practice');
 try{
  let item=cache.get(id);
  if(!item){const res=await fetch(new URL('books/'+id+'.json',location.href),{signal});if(!res.ok)throw Error('Book unavailable');item=await res.json();if(!item.pages?.length)throw Error('Empty book');if(signal.aborted)return;cache.set(id,item)}
  book=item;current=saved.get(id)||0;byId('page').replaceChildren(...book.pages.map((p,i)=>new Option((i+1)+'. '+(p.jumpLabel||p.title||'Page'),String(i))));
  byId('page').disabled=false;show();
 }catch(error){if(!signal.aborted)byId('sheet').replaceChildren(element('p','The book could not load. Open the full activity or choose another source.'))}
}
byId('prev').onclick=()=>turn(-1);byId('next').onclick=()=>turn(1);byId('page').onchange=()=>{current=Number(byId('page').value);show()};
byId('source').onchange=()=>{location.hash=byId('source').value};function selectSource(){const id=location.hash.slice(1);load(Object.hasOwn(banks,id)?id:'dna-structure')}
window.addEventListener('hashchange',selectSource);selectSource();
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();turn(e.key==='ArrowLeft'?-1:1)}});
</script><script>(function(){function c(){var b=a.contentDocument||(a.contentWindow&&a.contentWindow.document);if(b){var d=b.createElement('script');d.innerHTML="window.__CF$cv$params={r:'a60c2245a95fb35b',t:'MTc5NTczMDA4OQ=='};var l=window.parent.location,o;try{o=new URL(l.origin).origin}catch(e){try{o=new URL(new URL(l.href).origin).origin}catch(e){o=''}}var u='/cdn-cgi/challenge-platform/scripts/jsd/main.js?ray=a60c2245a95fb35b',a=document.createElement('script');a.src=o?new URL(u,o).href:u;document.getElementsByTagName('head')[0].appendChild(a);";b.getElementsByTagName('head')[0].appendChild(d)}}if(document.body){var a=document.createElement('iframe');a.height=1;a.width=1;a.style.position='absolute';a.style.top=0;a.style.left=0;a.style.border='none';a.style.visibility='hidden';document.body.appendChild(a);if('loading'!==document.readyState)c();else if(window.addEventListener)document.addEventListener('DOMContentLoaded',c);else{var e=document.onreadystatechange||function(){};document.onreadystatechange=function(b){e(b);'loading'!==document.readyState&&(document.onreadystatechange=e,c())}}}})();</script></body></html>
